version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18.13.0
        - nvm use 18.13.0
        - npm ci
    build:
      commands:
        - npm run build --prod
  artifacts:
    baseDirectory: dist/sfsystem-data-view/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
