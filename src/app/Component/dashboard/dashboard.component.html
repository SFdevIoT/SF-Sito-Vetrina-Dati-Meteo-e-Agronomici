<div class="dashboard-container">
  <div class="selection-area">
    <div class="table-group-bar-container">
      <h3 class="rotated-header">Seleziona Sorgente dati</h3>
      <div class="table-group-bar-wrapper">
    <app-table-group-bar></app-table-group-bar>
  </div>
    </div>
    
  <div class="chart-previews-container">
    <h3 class="rotated-header">Anteprime Grafici</h3>
    <div class="chart-previews">
    <div class="chart-preview" (click)="selectChart('et0-etc')">
      <app-et0-etc-trend></app-et0-etc-trend>
    </div>
    <div class="chart-preview" (click)="selectChart('precipitation')">
      <app-precipitation></app-precipitation>
    </div>
    <div class="chart-preview" (click)="selectChart('rain-et0-etc')">
      <app-rain-et0-etc-trend></app-rain-et0-etc-trend>
    </div>
    <div class="chart-preview" (click)="selectChart('rainfall-fertigation')">
      <app-rainfall-fertigation-event></app-rainfall-fertigation-event>
    </div>
  </div>
  </div>
  </div>



  <div class="main-content">
    <p-splitter [style]="{ height: '100%' }" [panelSizes]="[70, 30]" [minSizes]="[60, 20]">
      <ng-template pTemplate>
        <div class="table-panel">
          <div class="expand-icon" (click)="openFullscreen('table')">
            <i class="pi pi-expand"></i>
            </div>
          <app-tables-dashboard class="specific-table-css"></app-tables-dashboard>
        </div>
      </ng-template>
      
      <ng-template pTemplate>
        <div class="active-chart-panel" (click)="openFullscreen('chart')">
          <ng-container [ngSwitch]="selectedChart">
            <app-et0-etc-trend *ngSwitchCase="'et0-etc'"></app-et0-etc-trend>
            <app-precipitation *ngSwitchCase="'precipitation'"></app-precipitation>
            <app-rain-et0-etc-trend *ngSwitchCase="'rain-et0-etc'"></app-rain-et0-etc-trend>
            <app-rainfall-fertigation-event *ngSwitchCase="'rainfall-fertigation'"></app-rainfall-fertigation-event>
          </ng-container>
        </div>
      </ng-template>
    </p-splitter>
  </div>
</div>


<p-dialog [(visible)]="isFullscreenVisible" [modal]="true" [style]="{width: '100vw', height: '100vh'}" [baseZIndex]="10000"
          [draggable]="false" [resizable]="false">
  <ng-template pTemplate="content">
    <div class="fullscreen-content">
      <ng-container *ngIf="fullscreenType === 'table'">
        <app-tables-dashboard></app-tables-dashboard>
      </ng-container>
      <ng-container *ngIf="fullscreenType === 'chart'">
        <ng-container [ngSwitch]="selectedChart">
          <app-et0-etc-trend *ngSwitchCase="'et0-etc'"></app-et0-etc-trend>
          <app-precipitation *ngSwitchCase="'precipitation'"></app-precipitation>
          <app-rain-et0-etc-trend *ngSwitchCase="'rain-et0-etc'"></app-rain-et0-etc-trend>
          <app-rainfall-fertigation-event *ngSwitchCase="'rainfall-fertigation'"></app-rainfall-fertigation-event>
        </ng-container>
      </ng-container>
    </div>
  </ng-template>
</p-dialog>
